<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma-Scan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .search-section {
            padding: 40px;
        }
        
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: #4facfe;
        }
        
        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
        }
        
        .results {
            display: grid;
            gap: 20px;
        }
        
        .drug-card {
            border: 1px solid #e1e5e9;
            border-radius: 15px;
            padding: 20px;
            transition: box-shadow 0.3s;
        }
        
        .drug-card:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .drug-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .drug-arabic {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 15px;
        }
        
        .drug-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .detail-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .detail-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
        }
        
        .detail-value {
            color: #6c757d;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .scanner-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 30px;
            transition: transform 0.2s;
        }
        
        .scanner-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 Pharma-Scan</h1>
            <p>Egyptian Drug Database & Scanner</p>
        </div>
        
        <div class="search-section">
            <button class="scanner-btn" onclick="openScanner()">
                📷 Scan Prescription
            </button>
            
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Search for medicines (e.g., Panadol, Augmentin)..."
                    onkeypress="handleKeyPress(event)"
                >
                <button class="search-btn" onclick="searchDrugs()">Search</button>
            </div>
            
            <div id="results" class="results"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchDrugs();
            }
        }
        
        async function searchDrugs() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!query) {
                resultsDiv.innerHTML = '<div class="error">Please enter a search term</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div class="loading">🔍 Searching...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/drugs?search=${encodeURIComponent(query)}&limit=20`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.drugs && data.drugs.length > 0) {
                    displayResults(data.drugs);
                } else {
                    resultsDiv.innerHTML = '<div class="error">No medicines found. Try a different search term.</div>';
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = '<div class="error">❌ Error searching for medicines. Please check if the server is running.</div>';
            }
        }
        
        function displayResults(drugs) {
            const resultsDiv = document.getElementById('results');
            
            const html = drugs.map(drug => `
                <div class="drug-card">
                    <div class="drug-name">${drug.name}</div>
                    ${drug.nameArabic ? `<div class="drug-arabic">${drug.nameArabic}</div>` : ''}
                    <div class="drug-details">
                        ${drug.activeIngredient ? `
                            <div class="detail-item">
                                <div class="detail-label">Active Ingredient</div>
                                <div class="detail-value">${drug.activeIngredient}</div>
                            </div>
                        ` : ''}
                        ${drug.category ? `
                            <div class="detail-item">
                                <div class="detail-label">Category</div>
                                <div class="detail-value">${drug.category}</div>
                            </div>
                        ` : ''}
                        ${drug.manufacturer ? `
                            <div class="detail-item">
                                <div class="detail-label">Manufacturer</div>
                                <div class="detail-value">${drug.manufacturer}</div>
                            </div>
                        ` : ''}
                        ${drug.price ? `
                            <div class="detail-item">
                                <div class="detail-label">Price</div>
                                <div class="detail-value">EGP ${drug.price}</div>
                            </div>
                        ` : ''}
                        ${drug.form ? `
                            <div class="detail-item">
                                <div class="detail-label">Form</div>
                                <div class="detail-value">${drug.form}</div>
                            </div>
                        ` : ''}
                    </div>
                    ${drug.dosing ? `
                        <div style="margin-top: 15px; padding: 10px; background: #e3f2fd; border-radius: 8px;">
                            <div class="detail-label">Dosing Information</div>
                            <div class="detail-value">${drug.dosing}</div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
            
            resultsDiv.innerHTML = html;
        }
        
        function openScanner() {
            alert('Scanner feature requires the mobile app. For now, you can search for medicines using the search box above.');
        }
        
        // Load some popular drugs on page load
        window.addEventListener('load', () => {
            document.getElementById('searchInput').value = 'Panadol';
            searchDrugs();
        });
    </script>
</body>
</html>
