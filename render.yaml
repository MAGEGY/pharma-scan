services:
  - type: web
    name: pharmascan
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:production
    startCommand: npm run server:prod
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=3072
      - key: EXPO_PUBLIC_DOMAIN
        value: pharmascan.onrender.com
